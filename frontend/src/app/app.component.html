<div class="bg-blob-1"></div>
<div class="bg-blob-2"></div>

<div class="container">
  
  <header class="text-center mb-8">
    <h1 style="font-size: 3rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">{{ title }}</h1>
    <p class="text-muted" style="font-size: 1.1rem; font-weight: 500;">{{ subtitle }}</p>
  </header>

  <main *ngIf="!results && !isAnalyzing">
    
    <app-resume-upload 
      [selectedFileMetadata]="pdfFileMetadata"
      (fileSelected)="onFileSelected($event)"
      (fileRemoved)="onFileRemoved()">
    </app-resume-upload>
    
    <app-job-description 
      [jdText]="jobDescription"
      (jdTextChange)="onJdChange($event)">
    </app-job-description>

    <div *ngIf="errorMsg" class="card mt-4" style="background-color: #fef2f2; border-color: #fca5a5;">
      <p class="text-error text-center" style="margin: 0; font-weight: 500;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 0.5rem;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        {{ errorMsg }}
      </p>
    </div>

    <div class="text-center mt-8">
      <button 
        class="btn btn-primary" 
        style="padding: 1rem 3rem; font-size: 1.1rem;"
        [disabled]="!canAnalyze" 
        (click)="analyzeResume()">
        Analyze Resume
      </button>
    </div>

  </main>

  <main *ngIf="isAnalyzing">
    <app-loading></app-loading>
  </main>

  <main *ngIf="results">
    <div class="text-center mb-8">
      <h1 style="color: var(--primary-color);">RESULTS</h1>
      <hr style="width: 60px; margin: 1rem auto; border: 2px solid var(--primary-color); border-radius: 2px;">
    </div>
    
    <app-results 
      [results]="results"
      (analyzeAgain)="resetAnalysis()">
    </app-results>
  </main>

</div>
